plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sooraj.autocadmcq'
    compileSdk 35

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'upload-keystore.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('KEY_ALIAS') ?: ''
            keyPassword System.getenv('KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        debug {
            if (System.getenv('KEYSTORE_PASSWORD') && System.getenv('KEY_ALIAS') && System.getenv('KEY_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
    }

    defaultConfig {
        applicationId 'com.sooraj.autocadmcq'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}
